{% extends 'core/base.html' %}

{% block title %}
Criar conta | Ecomply
{% endblock %}

{% block content %}
<section class="auth-container">
    <div class="auth-card">
        <span class="badge">Novo Usuário</span>
        <h1 class="auth-title">Crie sua conta</h1>
        <p class="auth-subtitle">
            Cadastre-se no Ecomply e comece a explorar nossas ferramentas.
        </p>

        <form method="POST" class="auth-form">
            {% csrf_token %}

            <div class="django-form-fields">
                {{ form.as_p }}
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Criar conta
            </button>
        </form>

        <div class="auth-footer">
            <p>
                Já possui uma conta?
                <a href="{% url 'login' %}" class="link-highlight">
                    Entrar
                </a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
