{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Ecomply{% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">

    <!-- MODO ESCURO -->
    <style>

        /* ==========================================
           NOVA PALETA - MODO ESCURO
           Azul:       #0D1959
           Terracota:  #8C3E14
           Verde/cinza:#4C6565
           Cinza:      #AEB6C2
           Creme:      #FFF3CD
           ========================================== */


        /* FUNDO DA PÁGINA */

        body.dark-theme {
            background-color: #080f2f !important;
            color: #FFF3CD !important;

            background-image:
                radial-gradient(
                    rgba(174, 182, 194, 0.18) 1.5px,
                    transparent 1.5px
                ) !important;
        }


        /* ==========================================
           CARDS E BLOCOS
           ========================================== */

        body.dark-theme header,
        body.dark-theme footer,
        body.dark-theme nav,
        body.dark-theme form,
        body.dark-theme details,
        body.dark-theme article,
        body.dark-theme div:not(.main-content):not(.navbar):not(.nav-links) {
            background-color: #0D1959 !important;
            border-color: #4C6565 !important;
        }


        /* Áreas de layout continuam transparentes */

        body.dark-theme main,
        body.dark-theme .main-content,
        body.dark-theme section {
            background-color: transparent !important;
        }


        /* ==========================================
           TÍTULOS
           ========================================== */

        body.dark-theme h1,
        body.dark-theme h2,
        body.dark-theme h3,
        body.dark-theme h4,
        body.dark-theme h5,
        body.dark-theme h6,
        body.dark-theme strong,
        body.dark-theme b,
        body.dark-theme .logo {
            color: #FFF3CD !important;
        }


        /* ==========================================
           TEXTOS
           ========================================== */

        body.dark-theme p,
        body.dark-theme li,
        body.dark-theme label,
        body.dark-theme small {
            color: #AEB6C2 !important;
        }


        /* ==========================================
           LINKS DA NAVBAR
           ========================================== */

        body.dark-theme .nav-item,
        body.dark-theme .user-welcome,
        body.dark-theme .btn-login,
        body.dark-theme .btn-register,
        body.dark-theme .btn-logout {
            color: #FFF3CD !important;
        }


        body.dark-theme .nav-item:hover,
        body.dark-theme .user-welcome:hover,
        body.dark-theme .btn-login:hover,
        body.dark-theme .btn-register:hover,
        body.dark-theme .btn-logout:hover {
            color: #AEB6C2 !important;
        }


        /* Links comuns */

        body.dark-theme
        a:not(.btn):not(.btn-primary):not(.btn-login):not(.btn-register):not(.btn-logout) {
            color: #FFF3CD;
        }


        /* ==========================================
           BADGES / PÍLULAS
           ========================================== */

        body.dark-theme span[class*="badge"],
        body.dark-theme div[class*="badge"],
        body.dark-theme span[class*="tag"],
        body.dark-theme div[class*="pill"] {
            background-color: #FFF3CD !important;
            color: #0D1959 !important;
        }


        /* ==========================================
           BOTÃO PRINCIPAL
           ========================================== */

        body.dark-theme .btn-primary {
            background-color: #8C3E14 !important;
            color: #ffffff !important;
            border-color: #8C3E14 !important;
        }


        body.dark-theme .btn-primary:hover {
            background-color: #a54c1d !important;
            border-color: #a54c1d !important;
        }


        /* ==========================================
           BOTÃO SECUNDÁRIO
           ========================================== */

        body.dark-theme .btn-secondary {
            background-color: transparent !important;
            color: #FFF3CD !important;
            border-color: #AEB6C2 !important;
        }


        body.dark-theme .btn-secondary:hover {
            background-color: #FFF3CD !important;
            color: #0D1959 !important;
            border-color: #FFF3CD !important;
        }


        /* ==========================================
           CAMPOS DE FORMULÁRIO
           ========================================== */

        body.dark-theme input,
        body.dark-theme textarea,
        body.dark-theme select {
            background-color: #080f2f !important;
            color: #FFF3CD !important;
            border-color: #4C6565 !important;
        }


        body.dark-theme input:focus,
        body.dark-theme textarea:focus,
        body.dark-theme select:focus {
            border-color: #FFF3CD !important;
            box-shadow: 0 0 0 3px rgba(255, 243, 205, 0.15) !important;
        }


        body.dark-theme input::placeholder,
        body.dark-theme textarea::placeholder {
            color: #AEB6C2 !important;
        }


        /* ==========================================
           CARDS DA EQUIPE
           ========================================== */

        body.dark-theme .team-card:hover {
            border-color: #8C3E14 !important;
        }


        body.dark-theme .member-email {
            color: #AEB6C2 !important;
        }


        body.dark-theme .member-email:hover {
            color: #FFF3CD !important;
        }


        /* ==========================================
           BOTÃO DE MODO CLARO / ESCURO
           ========================================== */

        .theme-toggle-btn {
            background: transparent !important;
            border: 1px solid #AEB6C2 !important;
            border-radius: 6px !important;
            padding: 0.35rem 0.65rem !important;
            cursor: pointer !important;
            font-size: 0.82rem !important;
            font-weight: 500 !important;
            color: #4C6565 !important;
            transition: all 0.2s ease !important;
            margin-left: 1rem !important;
            display: inline-block !important;
            white-space: nowrap;
        }


        .theme-toggle-btn:hover {
            color: #8C3E14 !important;
            border-color: #8C3E14 !important;
            background-color: rgba(140, 62, 20, 0.06) !important;
        }


        body.dark-theme .theme-toggle-btn {
            color: #FFF3CD !important;
            border-color: #AEB6C2 !important;
        }


        body.dark-theme .theme-toggle-btn:hover {
            color: #0D1959 !important;
            border-color: #FFF3CD !important;
            background-color: #FFF3CD !important;
        }


        /* Perfil */

        .user-welcome {
            text-decoration: none;
        }

    </style>

</head>


<body>

    <header class="header">

        <nav class="navbar">

            <a href="{% url 'home' %}" class="logo">
                <strong>Ecomply</strong>
            </a>


            <div class="nav-links">

                <a href="{% url 'home' %}" class="nav-item">
                    Início
                </a>

                <a href="{% url 'quem_somos' %}" class="nav-item">
                    Quem Somos
                </a>

                <a href="{% url 'projeto' %}" class="nav-item">
                    O Projeto
                </a>

                <a href="{% url 'feedback' %}" class="nav-item">
                    Fale Conosco
                </a>


                {% if user.is_authenticated %}

                    <a href="{% url 'perfil' %}" class="user-welcome">
                        Meu Perfil
                    </a>

                    <a href="{% url 'logout' %}" class="btn-logout">
                        Sair
                    </a>

                {% else %}

                    <a href="{% url 'login' %}" class="btn-login">
                        Entrar
                    </a>

                    <a href="{% url 'cadastro' %}" class="btn-register">
                        Criar conta
                    </a>

                {% endif %}


                <button
                    id="theme-toggle"
                    class="theme-toggle-btn"
                    type="button"
                >
                    <span id="theme-text">
                        Modo Escuro
                    </span>
                </button>

            </div>

        </nav>

    </header>


    <main class="main-content">

        {% block content %}

        {% endblock %}

    </main>


    <footer class="footer">

        <p>
            © 2026 Ecomply — ESG de forma simples e acessível.
        </p>

    </footer>


    <!-- SCRIPT DE ALTERNÂNCIA DO TEMA -->

    <script>

        const toggleBtn =
            document.getElementById('theme-toggle');

        const themeText =
            document.getElementById('theme-text');


        // Carrega o tema salvo anteriormente

        if (
            localStorage.getItem('ecomply-theme') === 'dark'
        ) {

            document.body.classList.add('dark-theme');

            themeText.textContent = 'Modo Claro';

        }


        // Alterna entre modo claro e escuro

        toggleBtn.addEventListener('click', function() {

            document.body.classList.toggle('dark-theme');

            const isDark =
                document.body.classList.contains('dark-theme');


            if (isDark) {

                localStorage.setItem(
                    'ecomply-theme',
                    'dark'
                );

                themeText.textContent = 'Modo Claro';

            } else {

                localStorage.setItem(
                    'ecomply-theme',
                    'light'
                );

                themeText.textContent = 'Modo Escuro';

            }

        });

    </script>

</body>

</html>
