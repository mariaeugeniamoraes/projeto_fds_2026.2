<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login | Ecomply</title>
</head>

<body>

    <h1>Entrar no Ecomply</h1>

    {% if erro %}
        <p>{{ erro }}</p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <p>
            <label>Usuário:</label>
            <input type="text" name="username" required>
        </p>

        <p>
            <label>Senha:</label>
            <input type="password" name="password" required>
        </p>

        <button type="submit">Entrar</button>

    </form>

</body>

</html>
