{% extends 'core/base.html' %}

{% block title %}
Entrar | Ecomply
{% endblock %}


{% block content %}

    <h1>Entrar</h1>

    <p>
        Acesse sua conta para continuar no Ecomply.
    </p>

    {% if erro %}
        <p>{{ erro }}</p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div>
            <label for="username">Usuário:</label>
            <input
                type="text"
                id="username"
                name="username"
                required
            >
        </div>

        <div>
            <label for="password">Senha:</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </div>

        <button type="submit">
            Entrar
        </button>

    </form>

    <p>
        Ainda não possui uma conta?
        <a href="{% url 'cadastro' %}">
            Criar conta
        </a>
    </p>

{% endblock %}
